name: ELFGuard CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang

      - name: Build ELFGuard
        run: make

      - name: Run unit tests
        run: make test

      - name: Run sanitizer tests
        run: make test-sanitize

      - name: Run CLI integration tests
        run: make test-integration

      - name: Build fuzz harness
        run: make fuzz_elf_parser FUZZ_CC=clang
